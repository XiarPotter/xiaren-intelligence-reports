\"><span class=\"source\">FastGPT 官方更新</span><a class=\"link\" href=\"https://github.com/labring/FastGPT/releases/tag/v4.17.2\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article><article class=\"card\"><div class=\"meta\"><span class=\"num\">05</span><span class=\"category\">产品迭代（跨会话协作）</span><span class=\"product-mark\">Lovable</span></div><div class=\"capability\"><span>应用搭建 · 多任务</span><time class=\"capability-date\">10.09</time></div><h2>Lovable 聊天可引用并派发其他聊天任务</h2><div class=\"highlight\"><span>一个会话协调多个工作线程</span></div><p>通过 @ 或聊天链接读取其他聊天上下文，也可发送任务或创建新聊天，由目标聊天执行并回复结果。</p><div class=\"bottom\"><span class=\"source\">Lovable 官方更新</span><a class=\"link\" href=\"https://docs.lovable.dev/features/chats\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article></div><div class=\"section opinion-heading\"><h3>03 / Builders 观点洞察</h3></div><div class=\"empty-state\">本日暂未收录已核验的相关动态。</div>"},{"id":"daily-2026-10-08","type":"daily","start":"2026-10-08","end":"2026-10-08","label":"2026.10.08","content":"<div class=\"section\"><h3>01 / AI 模型</h3></div><div class=\"empty-state\">本日暂未收录已核验的相关动态。</div><div class=\"section\"><h3>02 / Agent 产品形态</h3></div><div class=\"grid\"><article class=\"card\"><div class=\"meta\"><span class=\"num\">01</span><span class=\"category\">产品迭代（办公 / 动画）</span><span class=\"product-mark\">Claude</span></div><div class=\"capability\"><span>办公 / 创作 · 动画</span><time class=\"capability-date\">10.08</time></div><h2>Claude 上线 Dashboards 与 Motion Beta</h2><div class=\"highlight\"><span>实时仪表盘与可编辑的动画解释</span></div><p>Dashboards 面向付费计划，可连接数据源；Motion 面向 Team 和 Enterprise，用代码制作动画并导出 MP4。Docs、Slides、Design 同期结束 Beta，覆盖 Free。</p><div class=\"bottom\"><span class=\"source\">Claude 官方公告</span><a class=\"link\" href=\"https://claude.com/resources/articles/dashboards-and-motion\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article><article class=\"card\"><div class=\"meta\"><span class=\"num\">02</span><span class=\"category\">工具使用（模型训练）</span><span class=\"product-mark\">ML Intern</span></div><div class=\"capability\"><span>专用 Agent · 模型训练</span><time class=\"capability-date\">10.08</time></div><h2>ML Intern 专用小模型实践</h2><div class=\"highlight\"><span>规划、训练、评估和发布交给 Agent</span></div><p>Hugging Face 的 Yuvraj Sharma 分享用 ML Intern 制作专用模型的过程，包括可在 CPU 上运行的 0.8B 提示词改写模型。这是实践案例，并非首次发布公告。</p><div class=\"bottom\"><span class=\"source\">Hugging Face 实践文章</span><a class=\"link\" href=\"https://huggingface.co/blog/building-with-ml-intern\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article><article class=\"card\"><div class=\"meta\"><span class=\"num\">03</span><span class=\"category\">产品迭代（Agent 工作台）</span><span class=\"product-mark\">TRAE</span></div><div class=\"capability\"><span>编程 / 办公 Agent · 工作台</span><time class=\"capability-date\">10.08</time></div><h2>TRAE 3.4.0 新增 Agent 窗口</h2><div class=\"highlight\"><span>跨项目调度智能体与定时任务</span></div><p>全局 Agent 窗口统一管理云端任务、定时任务和代码、文档、PPT、图片视频产物，可与 IDE 窗口切换并同步数据。</p><div class=\"bottom\"><span class=\"source\">TRAE 官方更新</span><a class=\"link\" href=\"https://docs.trae.cn/ide_changelog\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article><article class=\"card\"><div class=\"meta\"><span class=\"num\">04</span><span class=\"category\">产品工作流调整（远程开发）</span><span class=\"product-mark\">TRAE</span></div><div class=\"capability\"><span>编程 Agent · SSH / 多仓库</span><time class=\"capability-date\">10.08</time></div><h2>TRAE Agent 窗口支持 SSH 与多路径项目</h2><div class=\"highlight\"><span>任务可直接运行在远端环境</span></div><p>可连接远端开发机目录作为工作目录，一个项目挂载多个路径，文件树与搜索跨项目打通；同时新增桌面悬浮球，快速发起和查看任务。</p><div class=\"bottom\"><span class=\"source\">TRAE 官方更新</span><a class=\"link\" href=\"https://docs.trae.cn/ide_changelog\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article><article class=\"card\"><div class=\"meta\"><span class=\"num\">05</span><span class=\"category\">新产品（企业办公）</span><span class=\"product-mark\">Gemini Agent</span></div><div class=\"capability\"><span>企业 Agent · 工作编排</span><time class=\"capability-date\">10.08</time></div><h2>Google Cloud 宣布通用工作 Agent</h2><div class=\"highlight\"><span>持续执行目标，保留跨端上下文</span></div><p>统一处理知识工作、内容与代码，可安排定时或事件触发任务，调用企业工具及 Skills，并协调子 Agent。公告还介绍身份、审计与预算控制；具体账号开放资格需另行确认。</p><div class=\"bottom\"><span class=\"source\">Gemini Agent 官方更新</span><a class=\"link\" href=\"https://cloud.google.com/blog/products/ai-machine-learning/welcome-to-gemini-at-work-2026\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article><article class=\"card\"><div class=\"meta\"><span class=\"num\">06</span><span class=\"category\">产品迭代（编程）</span><span class=\"product-mark\">Codex CLI</span></div><div class=\"capability\"><span>编程 Agent · 并行任务</span><time class=\"capability-date\">10.08</time></div><h2>Codex CLI 0.162.0 增加工作树管理</h2><div class=\"highlight\"><span>并行任务有独立工作目录</span></div><p>启用 worktrees 功能后，可为受信任本地项目创建和列出托管 Git 工作树；增加任务置顶、会话块复制及自定义模型提供商的网页访问配置。</p><div class=\"bottom\"><span class=\"source\">Codex CLI 官方更新</span><a class=\"link\" href=\"https://learn.chatgpt.com/docs/changelog\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article><article class=\"card\"><div class=\"meta\"><span class=\"num\">07</span><span class=\"category\">产品开放（高速编程）</span><span class=\"product-mark\">Codex / ChatGPT Work</span></div><div class=\"capability\"><span>编程 Agent · 高速模式</span><time class=\"capability-date\">10.08</time></div><h2>Sol Ultrafast 扩大任务生成速度</h2><div class=\"highlight\"><span>高速模式有套餐与管理员条件</span></div><p>官方日志明确适用于 Pro $500 和合资格 Enterprise / Edu，企业需管理员开启；支持美国与欧洲推理驻留。是运行模式开放，非另一个模型首次发布。</p><div class=\"bottom\"><span class=\"source\">Codex / ChatGPT Work 官方更新</span><a class=\"link\" href=\"https://learn.chatgpt.com/docs/changelog\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article><article class=\"card\"><div class=\"meta\"><span class=\"num\">08</span><span class=\"category\">产品集成（业务工具）</span><span class=\"product-mark\">Lovable</span></div><div class=\"capability\"><span>应用搭建 · 连接器</span><time class=\"capability-date\">10.08</time></div><h2>Lovable 新增客服、数据库与 BI 连接器</h2><div class=\"highlight\"><span>让生成应用访问业务数据</span></div><p>新增 Zendesk、Neon、MotherDuck、Oracle、Db2、Qlik、Omni、Metabase、GoodData 应用与聊天连接器；Loom 聊天连接器可读取视频转录、摘要和评论。</p><div class=\"bottom\"><span class=\"source\">Lovable 官方更新</span><a class=\"link\" href=\"https://docs.lovable.dev/changelog\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article><article class=\"card\"><div class=\"meta\"><span class=\"num\">09</span><span class=\"category\">产品试验（生图纠偏）</span><span class=\"product-mark\">Midjourney</span></div><div class=\"capability\"><span>创作平台 · 生图 / 试验</span><time class=\"capability-date\">10.08</time></div><h2>Midjourney Alpha 测试 Thinking Mode</h2><div class=\"highlight\"><span>重新生成前检查提示词偏差</span></div><p>在任务灯箱中选择 Rerun (Thinking)，尝试改善提示词遵循、文字与一致性。当前是 Alpha 测试，广泛开放仍是后续方向，不能当作稳定全量功能。</p><div class=\"bottom\"><span class=\"source\">Midjourney 官方更新</span><a class=\"link\" href=\"https://updates.midjourney.com/testing-thinking-mode/\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article><article class=\"card\"><div class=\"meta\"><span class=\"num\">10</span><span class=\"category\">产品迭代（创作协作）</span><span class=\"product-mark\">Midjourney</span></div><div class=\"capability\"><span>创作平台 · 团队协作</span><time class=\"capability-date\">10.08</time></div><h2>Midjourney Alpha 新增共享文件夹</h2><div class=\"highlight\"><span>按协作者或查看者邀请共创</span></div><p>协作者可在文件夹中生成并接续他人的作品，查看者可浏览；支持链接共享和权限选择。文件夹隐私不改变图片隐私，非 stealth 图片仍可能公开。</p><div class=\"bottom\"><span class=\"source\">Midjourney 官方更新</span><a class=\"link\" href=\"https://updates.midjourney.com/alpha-changelog-10-7-26/\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article></div><div class=\"section opinion-heading\"><h3>03 / Builders 观点洞察</h3></div><div class=\"grid\"><article class=\"card opinion\"><div class=\"meta\"><span class=\"num\">01</span><span class=\"category\">工具使用（用户研究）</span><span class=\"product-mark\">Claude</span></div><div class=\"capability\"><span>办公 Agent · 产品经理实践</span><time class=\"capability-date\">10.08</time></div><h2>Cat Wu 分享获取用户反馈的工作流</h2><div class=\"highlight\"><span>从使用数据到安排访谈</span></div><p>她描述用 Claude 找出上周最常使用某功能的十位用户，再推进短访谈安排。帖子展示工作方式，不代表所有账号均可直接执行。</p><div class=\"bottom\"><span class=\"source\">Cat Wu · X / follow-builders</span><a class=\"link\" href=\"https://x.com/_catwu/status/2107967210467803152\" target=\"_blank\" rel=\"noopener noreferrer\">查看原帖 ↗</a></div></article></div>"},{"id":"daily-2026-10-07","type":"daily","start":"2026-10-07","end":"2026-10-07","label":"2026.10.07","content":"<div class=\"section\"><h3>01 / AI 模型</h3></div><div class=\"grid\"><article class=\"card\"><div class=\"meta\"><span class=\"num\">01</span><span class=\"category\">推理模型发布</span><span class=\"product-mark\">Claude Haiku</span></div><div class=\"capability\"><span>文本 / 推理 / 代码</span><time class=\"capability-date\">10.07</time></div><h2>Claude Haiku 5.5 发布</h2><div class=\"highlight\"><span>服务高频、对成本敏感的任务</span></div><p>面向摘要、分类与上下文压缩等工作；同期下调 Sonnet 5.5 缓存读取价格。官方称 Haiku 5.5 的平均运行成本比 Haiku 4.5 低约 75%。</p><div class=\"bottom\"><span class=\"source\">Anthropic 官方公告</span><a class=\"link\" href=\"https://www.anthropic.com/claude-haiku-5-5\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article></div><div class=\"section\"><h3>02 / Agent 产品形态</h3></div><div class=\"grid\"><article class=\"card\"><div class=\"meta\"><span class=\"num\">01</span><span class=\"category\">产品迭代（Personal Agent）</span><span class=\"product-mark\">ChatGPT</span></div><div class=\"capability\"><span>综合助手 · 交互界面</span><time class=\"capability-date\">10.07</time></div><h2>ChatGPT 扩大 GPT-6 使用范围</h2><div class=\"highlight\"><span>Intelligent UI 让回答成为交互界面</span></div><p>公告安排从付费计划逐步开放，次日扩展至 Free 和 Go。付费计划与免费计划使用的 GPT-6 模型不同；企业使用取决于管理员设置。</p><div class=\"bottom\"><span class=\"source\">OpenAI 官方公告</span><a class=\"link\" href=\"https://openai.com/index/gpt-6-for-everyone/\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article><article class=\"card\"><div class=\"meta\"><span class=\"num\">02</span><span class=\"category\">产品迭代（工作流编排）</span><span class=\"product-mark\">Deep Agents</span></div><div class=\"capability\"><span>工作流 · 定时 / Skills</span><time class=\"capability-date\">10.07</time></div><h2>Managed Deep Agents v0.9 公开测试</h2><div class=\"highlight\"><span>对话内创建日程，按次配置模型和工具</span></div><p>更新包括定时执行、按次配置与 Slack 反馈。同期 Deep Agents 的 Skills 更新加入工具绑定、明确请求的技能预加载与长对话内重新加载。</p><div class=\"bottom\"><span class=\"source\">LangChain 官方公告</span><a class=\"link\" href=\"https://www.langchain.com/blog/managed-deep-agents-schedules-per-run-configuration-slack\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article><article class=\"card\"><div class=\"meta\"><span class=\"num\">03</span><span class=\"category\">新产品（游戏创作）</span><span class=\"product-mark\">Google Playground</span></div><div class=\"capability\"><span>新产品（游戏创作）</span><time class=\"capability-date\">10.07</time></div><h2>Google Labs 推出 Playground 实验</h2><div class=\"highlight\"><span>无需编程经验创建游戏</span></div><p>官方账号宣布实验性游戏创作平台，面向美国 18 岁以上用户。用户可通过想法生成游戏；属于实验开放，非全球正式发布。</p><div class=\"bottom\"><span class=\"source\">Google Labs · X / follow-builders</span><a class=\"link\" href=\"https://x.com/GoogleLabs/status/2107800195748737042\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article><article class=\"card\"><div class=\"meta\"><span class=\"num\">04</span><span class=\"category\">产品权益更新（API）</span><span class=\"product-mark\">Claude</span></div><div class=\"capability\"><span>Agent 平台 · API 权益</span><time class=\"capability-date\">10.07</time></div><h2>Claude Max 与 Team 增加月度 API 额度</h2><div class=\"highlight\"><span>订阅包含自建应用与 Agent 的 API 权益</span></div><p>绑定 Claude Console 组织后领取，Max 在个人 Billing、Team 在组织 Billing 操作；分几天逐步开放，不等同所有订阅已同步完成。</p><div class=\"bottom\"><span class=\"source\">Claude 官方更新</span><a class=\"link\" href=\"https://support.claude.com/en/articles/17154008-monthly-api-credits-for-max-and-team-plans\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article><article class=\"card\"><div class=\"meta\"><span class=\"num\">05</span><span class=\"category\">产品集成（MCP）</span><span class=\"product-mark\">Codex CLI</span></div><div class=\"capability\"><span>编程 Agent · MCP / 平台接入</span><time class=\"capability-date\">10.07</time></div><h2>Codex CLI 可在会话中登录 MCP</h2><div class=\"highlight\"><span>减少工具授权时的切换</span></div><p>0.161.0 支持 /mcp login，在活跃终端会话中完成 MCP 登录；支持保存语音设备选择，并扩展兼容模型的 Bedrock 多 Agent 与 Ultra 推理支持。</p><div class=\"bottom\"><span class=\"source\">Codex CLI 官方更新</span><a class=\"link\" href=\"https://learn.chatgpt.com/docs/changelog\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article><article class=\"card\"><div class=\"meta\"><span class=\"num\">06</span><span class=\"category\">产品迭代（数据库诊断）</span><span class=\"product-mark\">Lovable</span></div><div class=\"capability\"><span>应用搭建 · 数据库</span><time class=\"capability-date\">10.07</time></div><h2>Lovable 可诊断 Cloud 数据库高负载</h2><div class=\"highlight\"><span>先排查查询，再考虑扩容</span></div><p>高负载提示可触发诊断，建议查询或代码优化；需要扩容时展示额度影响并请求批准，聊天扩容限付费套餐。</p><div class=\"bottom\"><span class=\"source\">Lovable 官方更新</span><a class=\"link\" href=\"https://docs.lovable.dev/features/advanced-settings\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article></div><div class=\"section opinion-heading\"><h3>03 / Builders 观点洞察</h3></div><div class=\"grid\"><article class=\"card opinion\"><div class=\"meta\"><span class=\"num\">01</span><span class=\"category\">工具使用（编程）</span><span class=\"product-mark\">Claude Code</span></div><div class=\"capability\"><span>编程 Agent · 使用方法</span><time class=\"capability-date\">10.07</time></div><h2>Boris Cherny：告诉 Claude 目标与验收方式</h2><div class=\"highlight\"><span>目标、投入程度、如何验证</span></div><p>他主张多数任务不必过度规定步骤，重点交代要做什么、花多少精力，以及如何检查结果。这是他的使用建议。</p><div class=\"bottom\"><span class=\"source\">Boris Cherny · X / follow-builders</span><a class=\"link\" href=\"https://x.com/bcherny/status/2107565388250874193\" target=\"_blank\" rel=\"noopener noreferrer\">查看原帖 ↗</a></div></article></div>"},{"id":"daily-2026-10-06","type":"daily","start":"2026-10-06","end":"2026-10-06","label":"2026.10.06","content":"<div class=\"section\"><h3>01 / AI 模型</h3></div><div class=\"grid\"><article class=\"card\"><div class=\"meta\"><span class=\"num\">01</span><span class=\"category\">安全模型开放范围调整</span><span class=\"product-mark\">Claude</span></div><div class=\"capability\"><span>安全模型开放范围调整</span><time class=\"capability-date\">10.06</time></div><h2>Anthropic 扩展 Cyber Verification Program</h2><div class=\"highlight\"><span>按安全工作范围提供三档访问权限</span></div><p>新增 Defense、Red Team 和 Specialized 三档，合资格安全专业人员可申请对应模型与安全限制配置。不同档位有验证及安全控制要求，未对所有用户直接开放。</p><div class=\"bottom\"><span class=\"source\">Anthropic 官方公告</span><a class=\"link\" href=\"https://www.anthropic.com/news/cyber-verification-program\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article></div><div class=\"section\"><h3>02 / Agent 产品形态</h3></div><div class=\"grid\"><article class=\"card\"><div class=\"meta\"><span class=\"num\">01</span><span class=\"category\">产品迭代（远程 Agent）</span><span class=\"product-mark\">Cursor</span></div><div class=\"capability\"><span>编程 Agent · 跨端协作</span><time class=\"capability-date\">10.06</time></div><h2>Cursor iOS 可远程查看本地 Agent</h2><div class=\"highlight\"><span>手机回复，任务仍在电脑运行</span></div><p>登录 iOS App 后配对电脑，即可查看与回复本地 Agent。电脑需保持在线；Enterprise 需管理员开启。该能力不要求使用 Cloud Agents。</p><div class=\"bottom\"><span class=\"source\">Cursor 官方更新</span><a class=\"link\" href=\"https://cursor.com/changelog/remote-control-local-agents\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article><article class=\"card\"><div class=\"meta\"><span class=\"num\">02</span><span class=\"category\">产品集成（生图）</span><span class=\"product-mark\">ComfyUI</span></div><div class=\"capability\"><span>创作平台 · 图像工作流</span><time class=\"capability-date\">10.06</time></div><h2>ComfyUI Partner Nodes 接入 Nano Banana 2.1</h2><div class=\"highlight\"><span>工作流内生成与多轮编辑图像</span></div><p>支持最多 14 张参考图、1K–4K 输出及三档思考强度；可在节点工作流中做局部修改与多轮编辑。这是平台接入更新。</p><div class=\"bottom\"><span class=\"source\">ComfyUI 官方更新</span><a class=\"link\" href=\"https://blog.comfy.org/p/gemini-nano-banana-21-is-now-available\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article><article class=\"card\"><div class=\"meta\"><span class=\"num\">03</span><span class=\"category\">产品迭代（办公画布）</span><span class=\"product-mark\">Gamma 5</span></div><div class=\"capability\"><span>办公 Agent · 演示文稿 / 画布</span><time class=\"capability-date\">10.06</time></div><h2>Gamma 5 支持 Agent 与自由画布编辑</h2><div class=\"highlight\"><span>生成后可直接调整单个元素</span></div><p>更新面向所有用户和套餐。Agent 可对话梳理叙事、保持编辑上下文，也可切到自由画布手动排布元素；新增企业连接器、保留设计的 PPT/PDF 导入导出。跨项目记忆仍是后续计划。</p><div class=\"bottom\"><span class=\"source\">Gamma 5 官方更新</span><a class=\"link\" href=\"https://gamma.app/insights/introducing-gamma-5-your-story-your-style-your-tools\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article><article class=\"card\"><div class=\"meta\"><span class=\"num\">04</span><span class=\"category\">产品 API 更新（3D 打印）</span><span class=\"product-mark\">Meshy</span></div><div class=\"capability\"><span>3D 平台 · 打印 / API</span><time class=\"capability-date\">10.06</time></div><h2>Meshy 检查并修复目标尺寸下的薄壁</h2><div class=\"highlight\"><span>按实际打印尺寸判断可打印性</span></div><p>Analyze / Repair Printability 可接收打印机类型与打印尺寸，报告薄壁并进行增厚修复；旧调用方式和定价保持不变。</p><div class=\"bottom\"><span class=\"source\">Meshy 官方更新</span><a class=\"link\" href=\"https://docs.meshy.ai/en/api/changelog\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article><article class=\"card\"><div class=\"meta\"><span class=\"num\">05</span><span class=\"category\">产品工作流调整（协作）</span><span class=\"product-mark\">v0</span></div><div class=\"capability\"><span>应用搭建 · 团队协作</span><time class=\"capability-date\">10.06</time></div><h2>v0 将个人账号迁移为团队工作空间</h2><div class=\"highlight\"><span>个人项目也能邀请成员协作</span></div><p>原有聊天、项目及设置自动迁移到团队工作空间，用户可邀请其他人协作，无需重新创建项目。</p><div class=\"bottom\"><span class=\"source\">v0 官方更新</span><a class=\"link\" href=\"https://v0.app/changelog\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article><article class=\"card\"><div class=\"meta\"><span class=\"num\">06</span><span class=\"category\">产品集成（画布）</span><span class=\"product-mark\">Lovable</span></div><div class=\"capability\"><span>应用搭建 · 画布 / 连接器</span><time class=\"capability-date\">10.06</time></div><h2>Lovable 聊天接入 Excalidraw+</h2><div class=\"highlight\"><span>读取并编辑图解与线框</span></div><p>预置聊天连接器支持列表、搜索与编辑 Excalidraw+ 工作区场景。同期新增 Klaviyo 应用连接器，Databricks 支持个人 OAuth。</p><div class=\"bottom\"><span class=\"source\">Lovable 官方更新</span><a class=\"link\" href=\"https://docs.lovable.dev/changelog\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article></div><div class=\"section opinion-heading\"><h3>03 / Builders 观点洞察</h3></div><div class=\"grid\"><article class=\"card opinion\"><div class=\"meta\"><span class=\"num\">01</span><span class=\"category\">技术工程经验</span></div><div class=\"capability\"><span>技术工程经验</span><time class=\"capability-date\">10.06</time></div><h2>Thariq：结构化组件规划可减少 token</h2><div class=\"highlight\"><span>复用组件逻辑，避免重建常见结构</span></div><p>他认为用组件规划状态机、图解和代码片段，相比直接生成原始 HTML 更节省 token。帖子缺少完整引用上下文与量化测试，作为工程观点收录。</p><div class=\"bottom\"><span class=\"source\">Thariq · X / follow-builders</span><a class=\"link\" href=\"https://x.com/trq212/status/2107294499282293017\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article></div>"},{"id":"daily-2026-10-05","type":"daily","start":"2026-10-05","end":"2026-10-05","label":"2026.10.05","content":"<div class=\"section\"><h3>01 / AI 模型</h3></div><div class=\"empty-state\">本日暂未收录已核验的相关动态。</div><div class=\"section\"><h3>02 / Agent 产品形态</h3></div><div class=\"grid\"><article class=\"card\"><div class=\"meta\"><span class=\"num\">01</span><span class=\"category\">产品集成（音乐）</span><span class=\"product-mark\">Lovable</span></div><div class=\"capability\"><span>应用搭建 · 音乐</span><time class=\"capability-date\">10.05</time></div><h2>Lovable 应用可接入 Lyria 3 音乐生成</h2><div class=\"highlight\"><span>文字或图片生成歌曲与纯音乐</span></div><p>可选 Clip Preview 约30秒片段，或 Pro Preview 最长184秒曲目；成功生成后按曲目收费。</p><div class=\"bottom\"><span class=\"source\">Lovable 官方更新</span><a class=\"link\" href=\"https://docs.lovable.dev/features/ai\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article></div><div class=\"section opinion-heading\"><h3>03 / Builders 观点洞察</h3></div><div class=\"grid\"><article class=\"card opinion\"><div class=\"meta\"><span class=\"num\">01</span><span class=\"category\">技术工程经验</span><span class=\"product-mark\">gdp-ts</span></div><div class=\"capability\"><span>技术工程经验</span><time class=\"capability-date\">10.05</time></div><h2>Guillermo 推出 gdp-ts 安全约束实践</h2><div class=\"highlight\"><span>用类型检查验证授权证明</span></div><p>他介绍面向 TypeScript 的库、linter 和 AI skill：敏感函数要求调用者提供已做授权检查的证明，并在编译阶段校验。意在给 Agent 写代码的过程增加可验证约束。</p><div class=\"bottom\"><span class=\"source\">Guillermo Rauch · X / follow-builders</span><a class=\"link\" href=\"https://x.com/rauchg/status/2107119811444748555\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article><article class=\"card opinion\"><div class=\"meta\"><span class=\"num\">02</span><span class=\"category\">Agent 行业洞察</span></div><div class=\"capability\"><span>Agent 行业洞察</span><time class=\"capability-date\">10.05</time></div><h2>Aaron Levie：Agent 部署催生新工作</h2><div class=\"highlight\"><span>应用工程与企业部署服务需求增长</span></div><p>他观察企业需要应用 AI 工程师、部署 Agent 的 FDE 和服务团队，也有既有技术岗位转向 AI。属于其行业观察，未提供完整就业统计。</p><div class=\"bottom\"><span class=\"source\">Aaron Levie · X / follow-builders</span><a class=\"link\" href=\"https://x.com/levie/status/2106893015063421357\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article></div>"},{"id":"daily-2026-10-04","type":"daily","start":"2026-10-04","end":"2026-10-04","label":"2026.10.04","content":"<div class=\"section\"><h3>01 / AI 模型</h3></div><div class=\"empty-state\">本日暂未收录已核验的相关动态。</div><div class=\"section\"><h3>02 / Agent 产品形态</h3></div><div class=\"grid\"><article class=\"card\"><div class=\"meta\"><span class=\"num\">01</span><span class=\"category\">产品集成（邮箱）</span><span class=\"product-mark\">WorkBuddy</span></div><div class=\"capability\"><span>办公 Agent · 邮箱</span><time class=\"capability-date\">10.04</time></div><h2>WorkBuddy 海外版接入 Gmail</h2><div class=\"highlight\"><span>在任务中读取和发送邮件</span></div><p>5.7.6 新增 Gmail 连接器，限海外版；授权完成后可直接读取和发送邮件。该更新与前一天的 Outlook 接入分开归档。</p><div class=\"bottom\"><span class=\"source\">WorkBuddy 官方更新</span><a class=\"link\" href=\"https://www.workbuddy.cn/docs/workbuddy/Changelog\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article></div><div class=\"section opinion-heading\"><h3>03 / Builders 观点洞察</h3></div><div class=\"grid\"><article class=\"card opinion\"><div class=\"meta\"><span class=\"num\">01</span><span class=\"category\">工具使用（Personal Agent）</span><span class=\"product-mark\">dot</span></div><div class=\"capability\"><span>工具使用（Personal Agent）</span><time class=\"capability-date\">10.04</time></div><h2>Thibault 用 dot 协助清空收件箱</h2><div class=\"highlight\"><span>把收件箱清空设为持续目标</span></div><p>他称将 inbox zero 设为 dot 的目标后，首次实现收件箱清空；未披露具体邮件工具权限或完整操作流程。</p><div class=\"bottom\"><span class=\"source\">Thibault Sottiaux · X / follow-builders</span><a class=\"link\" href=\"https://x.com/thsottiaux/status/2106602729875685780\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article><article class=\"card opinion\"><div class=\"meta\"><span class=\"num\">02</span><span class=\"category\">产品设计</span><span class=\"product-mark\">Codex / Work</span></div><div class=\"capability\"><span>产品设计</span><time class=\"capability-date\">10.04</time></div><h2>Thibault：优先简化体验与提升效率</h2><div class=\"highlight\"><span>用户反馈推动产品做减法</span></div><p>他表示团队将聚焦简化、提高效率与可用额度、关键功能和新模型。这是负责人阐述的计划，不代表每项已上线。</p><div class=\"bottom\"><span class=\"source\">Thibault Sottiaux · X / follow-builders</span><a class=\"link\" href=\"https://x.com/thsottiaux/status/2106610099720720811\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article></div>"},{"id":"daily-2026-10-03","type":"daily","start":"2026-10-03","end":"2026-10-03","label":"2026.10.03","content":"<div class=\"section\"><h3>01 / AI 模型</h3></div><div class=\"empty-state\">本日暂未收录已核验的相关动态。</div><div class=\"section\"><h3>02 / Agent 产品形态</h3></div><div class=\"grid\"><article class=\"card\"><div class=\"meta\"><span class=\"num\">01</span><span class=\"category\">产品迭代（定时任务）</span><span class=\"product-mark\">WorkBuddy</span></div><div class=\"capability\"><span>办公 Agent · 定时任务</span><time class=\"capability-date\">10.03</time></div><h2>WorkBuddy 汇总定时任务运行结果</h2><div class=\"highlight\"><span>历次执行与产物集中查看</span></div><p>5.7.5 新增定时任务汇总页，按时间线呈现每次执行结果与产物；新增产物系统通知，点击提醒可打开对应文件。</p><div class=\"bottom\"><span class=\"source\">WorkBuddy 官方更新</span><a class=\"link\" href=\"https://www.workbuddy.cn/docs/workbuddy/Changelog\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article><article class=\"card\"><div class=\"meta\"><span class=\"num\">02</span><span class=\"category\">产品集成（邮箱）</span><span class=\"product-mark\">WorkBuddy</span></div><div class=\"capability\"><span>办公 Agent · 邮箱 / 日程</span><time class=\"capability-date\">10.03</time></div><h2>WorkBuddy 海外版新增 Outlook 连接器</h2><div class=\"highlight\"><span>授权后处理邮件、日程与联系人</span></div><p>5.7.5 新增 Outlook 连接器，限海外版。完成授权后可处理邮件、日程和联系人，不能直接推定国内版已开放。</p><div class=\"bottom\"><span class=\"source\">WorkBuddy 官方更新</span><a class=\"link\" href=\"https://www.workbuddy.cn/docs/workbuddy/Changelog\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article></div><div class=\"section opinion-heading\"><h3>03 / Builders 观点洞察</h3></div><div class=\"grid\"><article class=\"card opinion\"><div class=\"meta\"><span class=\"num\">01</span><span class=\"category\">工具使用（Personal Agent）</span><span class=\"product-mark\">dot</span></div><div class=\"capability\"><span>工具使用（Personal Agent）</span><time class=\"capability-date\">10.03</time></div><h2>Sam Altman：dot 逐步学习个人工作方式</h2><div class=\"highlight\"><span>把积压的琐事交给个人助理</span></div><p>他分享 dot 随使用逐渐适应个人流程与风格的体验，并帮助处理不喜欢做的事情。属于负责人个人体验，未提供独立效果测量。</p><div class=\"bottom\"><span class=\"source\">Sam Altman · X / follow-builders</span><a class=\"link\" href=\"https://x.com/sama/status/2106085986606403684\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article><article class=\"card opinion\"><div class=\"meta\"><span class=\"num\">02</span><span class=\"category\">AI 安全洞察</span></div><div class=\"capability\"><span>AI 安全洞察</span><time class=\"capability-date\">10.03</time></div><h2>Sam Altman：保留对 AI 的人类判断</h2><div class=\"highlight\"><span>警惕对模型赋予宗教权威</span></div><p>他对把模型视为宗教力量或向模型交出个人判断表示担忧，认为这涉及安全问题。该内容是人物观点。</p><div class=\"bottom\"><span class=\"source\">Sam Altman · X / follow-builders</span><a class=\"link\" href=\"https://x.com/sama/status/2106388373221118198\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article></div>"},{"id":"daily-2026-10-02","type":"daily","start":"2026-10-02","end":"2026-10-02","label":"2026.10.02","content":"<div class=\"section\"><h3>01 / AI 模型</h3></div><div class=\"empty-state\">本日暂未收录已核验的相关动态。</div><div class=\"section\"><h3>02 / Agent 产品形态</h3></div><div class=\"grid\"><article class=\"card\"><div class=\"meta\"><span class=\"num\">01</span><span class=\"category\">产品集成（决策模型）</span><span class=\"product-mark\">Replit</span></div><div class=\"capability\"><span>应用搭建 · AI 集成</span><time class=\"capability-date\">10.02</time></div><h2>Replit 接入 Jev 决策模型</h2><div class=\"highlight\"><span>为应用增加分类、路由与线索评分</span></div><p>通过 AI Integrations 使用 OpenRouter 的 jev-latest，无需自行管理提供商 API Key，可构建结构化决策功能。</p><div class=\"bottom\"><span class=\"source\">Replit 官方更新</span><a class=\"link\" href=\"https://docs.replit.com/updates/2026/10/02/changelog#jev-is-now-available-through-replit-ai-integrations\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article><article class=\"card\"><div class=\"meta\"><span class=\"num\">02</span><span class=\"category\">产品迭代（编程模型接入）</span><span class=\"product-mark\">Replit</span></div><div class=\"capability\"><span>编程 Agent · 模型接入</span><time class=\"capability-date\">10.02</time></div><h2>Replit Agent 接入 Sol 与 Sonnet 5.5</h2><div class=\"highlight\"><span>Power 与 Max 模式新增模型选择</span></div><p>Agent 的 Power Mode 可选择 Claude Sonnet 5.5，Max Mode 可选择 GPT-6.1 Sol。这是产品模型接入更新，非两款模型当天首发。</p><div class=\"bottom\"><span class=\"source\">Replit 官方更新</span><a class=\"link\" href=\"https://docs.replit.com/updates/2026/10/02/changelog#new-models-from-openai-and-anthropic\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article><article class=\"card\"><div class=\"meta\"><span class=\"num\">03</span><span class=\"category\">产品迭代（视频草稿）</span><span class=\"product-mark\">Runway Agent</span></div><div class=\"capability\"><span>创作 Agent · 视频</span><time class=\"capability-date\">10.02</time></div><h2>Runway Agent 新增 Seedance 2.5 Draft</h2><div class=\"highlight\"><span>先快速生成 480p 草稿再增强</span></div><p>所有套餐支持 Draft 模式，生成后可增强画质；Agent 会建议草稿模式，用户可切换开关，以加快试错。</p><div class=\"bottom\"><span class=\"source\">Runway Agent 官方更新</span><a class=\"link\" href=\"https://runway.com/changelog\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article><article class=\"card\"><div class=\"meta\"><span class=\"num\">04</span><span class=\"category\">产品集成（生图）</span><span class=\"product-mark\">Runway MCP</span></div><div class=\"capability\"><span>创作平台 · MCP</span><time class=\"capability-date\">10.02</time></div><h2>Runway MCP 接入 Ideogram 4.5</h2><div class=\"highlight\"><span>在 MCP 工作流中调用图像生成</span></div><p>付费套餐可通过 Runway MCP 使用 Ideogram 4.5。这是平台模型接入，并非 Ideogram 的模型首次发布。</p><div class=\"bottom\"><span class=\"source\">Runway MCP 官方更新</span><a class=\"link\" href=\"https://runway.com/changelog\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article><article class=\"card\"><div class=\"meta\"><span class=\"num\">05</span><span class=\"category\">产品迭代（任务入口）</span><span class=\"product-mark\">ChatGPT iOS</span></div><div class=\"capability\"><span>个人助手 · iOS / 任务</span><time class=\"capability-date\">10.02</time></div><h2>ChatGPT iOS 新增任务与额度小组件</h2><div class=\"highlight\"><span>主屏查看任务，锁屏查看剩余额度</span></div><p>1.2026.267 新增所选电脑的最近任务主屏小组件，以及显示用量和重置时间的主屏/锁屏小组件。</p><div class=\"bottom\"><span class=\"source\">ChatGPT iOS 官方更新</span><a class=\"link\" href=\"https://learn.chatgpt.com/docs/changelog\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article><article class=\"card\"><div class=\"meta\"><span class=\"num\">06</span><span class=\"category\">产品工作流调整（生图）</span><span class=\"product-mark\">Midjourney</span></div><div class=\"capability\"><span>创作平台 · 参数 / 编辑</span><time class=\"capability-date\">10.02</time></div><h2>Midjourney Alpha 保留文件夹参数</h2><div class=\"highlight\"><span>不同项目沿用不同生成设置</span></div><p>预览风格后保留提示栏设置，提示参数按文件夹和当前标签页会话保存；可将 --exp 设为文件夹默认，编辑结果保留底图比例。</p><div class=\"bottom\"><span class=\"source\">Midjourney 官方更新</span><a class=\"link\" href=\"https://updates.midjourney.com/alpha-changelog-10-1-26/\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article></div><div class=\"section opinion-heading\"><h3>03 / Builders 观点洞察</h3></div><div class=\"grid\"><article class=\"card opinion\"><div class=\"meta\"><span class=\"num\">01</span><span class=\"category\">工具使用</span></div><div class=\"capability\"><span>工具使用</span><time class=\"capability-date\">10.02</time></div><h2>Karpathy：让模型用更易理解的形式输出</h2><div class=\"highlight\"><span>从受控语言到图解与交互网页</span></div><p>他分享用 ASD-STE100 约束文字表达、让模型输出图解和 HTML 网页的方法，并看好定制讲解视频。这是使用建议和个人预测。</p><div class=\"bottom\"><span class=\"source\">Andrej Karpathy · X / follow-builders</span><a class=\"link\" href=\"https://x.com/karpathy/status/2105819303471976479\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article><article class=\"card opinion\"><div class=\"meta\"><span class=\"num\">02</span><span class=\"category\">产品设计</span><span class=\"product-mark\">Claude</span></div><div class=\"capability\"><span>产品设计</span><time class=\"capability-date\">10.02</time></div><h2>Boris Cherny：用 Mods 定制 Claude</h2><div class=\"highlight\"><span>通过提示词改变工作方式与界面</span></div><p>他介绍用提示词定制 Claude 的外观和行为，再以插件分享 Mods；强调不同人的工作方式应有不同的产品体验。</p><div class=\"bottom\"><span class=\"source\">Boris Cherny · X / follow-builders</span><a class=\"link\" href=\"https://x.com/bcherny/status/2105756563302723721\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article></div>"},{"id":"daily-2026-10-01","type":"daily","start":"2026-10-01","end":"2026-10-01","label":"2026.10.01","content":"<div class=\"section\"><h3>01 / AI 模型</h3></div><div class=\"empty-state\">本日暂未收录已核验的相关动态。</div><div class=\"section\"><h3>02 / Agent 产品形态</h3></div><div class=\"grid\"><article class=\"card\"><div class=\"meta\"><span class=\"num\">01</span><span class=\"category\">新产品（创作工作流）</span><span class=\"product-mark\">Comfy Agent</span></div><div class=\"capability\"><span>创作 Agent · 画布 / 工作流</span><time class=\"capability-date\">10.01</time></div><h2>Comfy Agent 在 Cloud 向所有用户开放</h2><div class=\"highlight\"><span>自然语言规划、搭建并运行节点工作流</span></div><p>可在画布内规划工作流、修复错误、寻找素材与迭代生成，支持公私有 Skills 及最多五个并行聊天。Desktop 当时仍计划数周后提供。</p><div class=\"bottom\"><span class=\"source\">Comfy Agent 官方更新</span><a class=\"link\" href=\"https://blog.comfy.org/p/comfy-agent-the-first-agent-for-craft\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article><article class=\"card\"><div class=\"meta\"><span class=\"num\">02</span><span class=\"category\">产品集成（Personal Agent）</span><span class=\"product-mark\">Runway</span></div><div class=\"capability\"><span>创作 Agent · 视频集成</span><time class=\"capability-date\">10.01</time></div><h2>Runway 接入 OpenAI Dots</h2><div class=\"highlight\"><span>个人 Agent 可调用视频创作能力</span></div><p>官方更新日志宣布 Runway 可在 OpenAI Dots 中使用，将视频生成连接到个人 Agent 的任务流程。</p><div class=\"bottom\"><span class=\"source\">Runway 官方更新</span><a class=\"link\" href=\"https://runway.com/changelog\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article><article class=\"card\"><div class=\"meta\"><span class=\"num\">03</span><span class=\"category\">产品开放（创作助手）</span><span class=\"product-mark\">Firefly AI Assistant</span></div><div class=\"capability\"><span>创作 Agent · 图像 / 视频</span><time class=\"capability-date\">10.01</time></div><h2>Firefly 创作助手扩大 Creative Cloud 覆盖</h2><div class=\"highlight\"><span>更多订阅用户可使用对话创作</span></div><p>官方 FAQ 明确从 10 月 1 日向所有 Creative Cloud 套餐用户开放，并对部分付费创作操作消耗 AI credits。限成人，桌面与移动 App 及部分企业/教育套餐不适用；功能仍为 Beta。</p><div class=\"bottom\"><span class=\"source\">Firefly AI Assistant 官方更新</span><a class=\"link\" href=\"https://helpx.adobe.com/firefly/web/firefly-ai-assistant/ai-assistant-faq.html\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article><article class=\"card\"><div class=\"meta\"><span class=\"num\">04</span><span class=\"category\">产品迭代（工作流额度）</span><span class=\"product-mark\">n8n Assistant</span></div><div class=\"capability\"><span>工作流 Agent · 额度管理</span><time class=\"capability-date\">10.01</time></div><h2>n8n Assistant 支持手动与自动补充额度</h2><div class=\"highlight\"><span>工作流搭建额度耗尽后可继续使用</span></div><p>Cloud Starter / Pro 可选购额外 Assistant credits，并设置自动补充的触发余额、目标余额与月度限额。该额度用于 Assistant 搭建，运行工作流不消耗它。</p><div class=\"bottom\"><span class=\"source\">n8n Assistant 官方更新</span><a class=\"link\" href=\"https://community.n8n.io/t/assistant-credits-top-up-now-available/318075\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article><article class=\"card\"><div class=\"meta\"><span class=\"num\">05</span><span class=\"category\">产品集成（实时语音）</span><span class=\"product-mark\">Lovable</span></div><div class=\"capability\"><span>应用搭建 · 实时语音</span><time class=\"capability-date\">10.01</time></div><h2>Lovable 可构建 GPT Live 语音应用</h2><div class=\"highlight\"><span>支持插话与语音触发动作</span></div><p>描述语音助教或助手后由 Lovable 配置，用户可对应用说话并打断；适用于 TanStack Start 应用，消耗额度。</p><div class=\"bottom\"><span class=\"source\">Lovable 官方更新</span><a class=\"link\" href=\"https://docs.lovable.dev/features/ai\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article></div><div class=\"section opinion-heading\"><h3>03 / Builders 观点洞察</h3></div><div class=\"grid\"><article class=\"card opinion\"><div class=\"meta\"><span class=\"num\">01</span><span class=\"category\">模型运行体验</span><span class=\"product-mark\">GPT-6.1 Sol</span></div><div class=\"capability\"><span>模型运行体验</span><time class=\"capability-date\">10.01</time></div><h2>Sam Altman：Sol 高负载速度已有改善</h2><div class=\"highlight\"><span>针对早期高负载下的响应变慢</span></div><p>他称 6.1 Sol 使用增长很快，早期高负载影响了速度，目前已改善。这是负责人披露的运行状态，未给出性能测试数据。</p><div class=\"bottom\"><span class=\"source\">Sam Altman · X / follow-builders</span><a class=\"link\" href=\"https://x.com/sama/status/2105688354834756036\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article><article class=\"card opinion\"><div class=\"meta\"><span class=\"num\">02</span><span class=\"category\">产品设计</span><span class=\"product-mark\">ChatGPT</span></div><div class=\"capability\"><span>产品设计</span><time class=\"capability-date\">10.01</time></div><h2>Sam Altman 看好登录与插件扩展</h2><div class=\"highlight\"><span>把订阅能力连接到更多使用场景</span></div><p>他认为 Sign In With ChatGPT 与 Plugin Extensions 的潜力尚未充分发挥。帖子表达产品方向判断，没有宣布具体新功能。</p><div class=\"bottom\"><span class=\"source\">Sam Altman · X / follow-builders</span><a class=\"link\" href=\"https://x.com/sama/status/2105687922234237364\" target=\"_blank\" rel=\"noopener noreferrer\">阅读原文 ↗</a></div></article></div>"}]</script><script>const reports=JSON.parse(document.getElementById('report-data').textContent);const requestedDate=new URLSearchParams(location.search).get('date');let selected=reports.find(r=>r.end===requestedDate)||reports[0];const weekStart=date=>{const d=new Date(date+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));return d.toISOString().slice(0,10)};const formatDay=date=>{const [,m,d]=date.split('-');return `${m}.${d}`};const weekLabel=monday=>{const d=new Date(monday+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+6);const sunday=d.toISOString().slice(0,10);return `${monday.slice(0,4)}.${formatDay(monday)} — ${formatDay(sunday)}`};function render(){const dates=document.getElementById('dates');dates.replaceChildren();const groups=new Map();reports.forEach(r=>{const key=weekStart(r.end);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(r)});groups.forEach((items,key)=>{const group=document.createElement('div');group.className='week-group';const heading=document.createElement('button');heading.type='button';heading.className='week-heading';heading.textContent=weekLabel(key);heading.setAttribute('aria-expanded','true');const days=document.createElement('div');days.className='week-days';heading.onclick=()=>{const open=heading.getAttribute('aria-expanded')==='true';heading.setAttribute('aria-expanded',String(!open));days.hidden=open};items.forEach(r=>{const b=document.createElement('button');b.type='button';b.textContent=formatDay(r.end);b.setAttribute('aria-label',r.label);b.setAttribute('aria-pressed',String(r===selected));b.onclick=()=>{selected=r;history.replaceState(null,'','?date='+r.end);render();window.scrollTo({top:0,behavior:'auto'})};days.append(b)});group.append(heading,days);dates.append(group)});document.getElementById('period').textContent=selected?selected.label:'—';document.getElementById('period-label').textContent='统计日期';document.getElementById('report').innerHTML=selected?selected.content:'<div class="empty-state">暂无已生成的日报，请选择左侧日期。</div>';}render();</script></body></html>
